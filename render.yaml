# PlantDiseaseAI Deployment Configuration for Render

services:
  - type: web
    name: plant-disease-ai
    runtime: python
    pythonVersion: 3.11
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.address 0.0.0.0"
    envVars:
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_PORT
        value: "$PORT"
      - key: STREAMLIT_SERVER_ADDRESS
        value: "0.0.0.0"
      - key: STREAMLIT_CLIENT_LOGGER_LEVEL
        value: "info"
      - key: PYTHONUNBUFFERED
        value: "1"
